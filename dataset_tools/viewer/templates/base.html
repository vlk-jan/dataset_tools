<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/viewer-static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/viewer-static/style.css">
<script src="/viewer-static/theme.js"></script>
{% block head %}{% endblock %}
</head>
<body{% block body_class %}{% endblock %}>
<a class="skip" href="#main">Skip to content</a>
<header>
{% block header %}{% endblock %}
</header>
<main id="main">
{% if data_problem %}<p class="databanner" role="alert">{{ data_problem }}</p>{% endif %}
{% block main %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
