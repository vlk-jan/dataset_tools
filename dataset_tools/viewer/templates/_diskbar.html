{# Disk usage bar + legend; `parts` from index_page.disk_parts. #}
<div class="diskbar" role="img" aria-label="disk usage by modality: {% for part in parts %}{{ part.label }} {{ part.pct }}{{ ', ' if not loop.last }}{% endfor %}">
  {% for part in parts %}<i class="dk-{{ part.key }}" style="width:{{ "%.3f"|format(part.share * 100) }}%" title="{{ part.label }}: {{ part.size }} ({{ part.pct }})"></i>{% endfor %}
</div>
<ul class="disklegend">
  {% for part in parts %}
  <li><i class="dk-{{ part.key }}"></i>{{ part.label }} <b>{{ part.size }}</b> <small>{{ part.pct }}</small></li>
  {% endfor %}
</ul>
