[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset_tools"
version = "1.0.1"
description = "Tools for extracting the HELHEST robot dataset from ROS 2 bags."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Jan Vlk", email = "vlkjan6@fel.cvut.cz" }]
maintainers = [{ name = "Jan Vlk", email = "vlkjan6@fel.cvut.cz" }]
keywords = ["robotics", "ros2", "rosbag", "dataset", "lidar", "helhest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "rosbags>=0.10",
    "numpy>=1.24",
    "opencv-python-headless>=4.5",
]

[project.optional-dependencies]
# httpx is what starlette's TestClient imports, so the viewer's route tests
# error at fixture setup without it even though nothing imports it directly.
test = ["pytest>=7", "httpx>=0.27"]
# The dataset viewer (dataset_tools.viewer). SimView provides the 3D front-end
# and the scene format; the viewer reads its page template, its columnar state
# packer and its debug handle, none of which a major release promises to keep,
# hence the upper bound; its "authoring" extra (torch + einops) is what the
# scene-building API needs, and it is the reason the viewer requires Python
# 3.12+ even though the extraction tools do not.
viewer = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "pillow>=10.0",
    "simview[authoring]>=5.1.1",
    # Listed directly only so the index below applies: uv honours an index
    # override for direct dependencies, not for simview's transitive torch.
    "torch",
]

# The viewer builds scenes on the CPU; the default Linux torch wheel drags in
# ~3 GB of CUDA libraries it never uses. Elsewhere (macOS) PyPI's wheel is used.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[project.urls]
Homepage = "https://github.com/vlk-jan/dataset_tools"
Source = "https://github.com/vlk-jan/dataset_tools"

# Kept in sync with setup.py: the ROS/ament build reads setup.py, plain pip
# reads this file, and both must install the same console scripts.
[project.scripts]
helhest-extract = "dataset_tools.extract.cli:main"
helhest-validate = "dataset_tools.validate_scene:main"
helhest-sort-bag = "dataset_tools.sort_bag:main"
helhest-viewer = "dataset_tools.viewer.__main__:main"
helhest-disk-usage = "dataset_tools.disk_usage:main"
helhest-image-format = "dataset_tools.image_format:main"
odom_recorder = "dataset_tools.odom_node:main"

[tool.setuptools]
packages = ["dataset_tools", "dataset_tools.extract", "dataset_tools.viewer"]

[tool.setuptools.package-data]
dataset_tools = ["libcloudini_shim.so"]
# Not recursive: the vendored front-end libraries need their own line.
"dataset_tools.viewer" = ["static/*", "static/vendor/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# The tree is formatted with this; 88 described nothing, nineteen files violated
# it. Twelve lines still sit above 120 and are meant to: probe.py's artefact
# table, held by `# fmt: off` because one aligned declaration per line is the
# point of it, and build.py's property accessors, long only because of a
# trailing `# type: ignore` that black will not move.
[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # line length is black's job; the few over-long lines are deliberate
    "B008",  # FastAPI's `Body(...)` in a route signature is the documented idiom
]

[tool.ruff.lint.isort]
known-first-party = ["dataset_tools"]
