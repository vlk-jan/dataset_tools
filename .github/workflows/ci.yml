name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "black==24.8.0" "ruff==0.6.9"
      - run: black --check dataset_tools scripts tests
      - run: ruff check dataset_tools scripts tests

  # The extraction tools alone, as a user without the viewer installs them.
  extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # The console scripts are what a user installs for; make sure they resolve.
      - run: |
          for cmd in helhest-extract helhest-validate helhest-sort-bag helhest-disk-usage helhest-image-format; do
            $cmd --help > /dev/null
          done
      # The viewer tests skip themselves when its extra is absent.
      - run: python -m pytest tests

  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[viewer,test]" --extra-index-url https://download.pytorch.org/whl/cpu
      - run: helhest-viewer --help > /dev/null
      - run: python -m pytest tests
